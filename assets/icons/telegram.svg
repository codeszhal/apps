<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="-3 -3 30 30" role="img" aria-label="Telegram">
  <defs>
    <radialGradient id="tg-glow" cx="58%" cy="50%" r="62%">
      <stop offset="0" stop-color="#bff0ff" stop-opacity=".95"/>
      <stop offset=".34" stop-color="#2AABEE" stop-opacity=".58"/>
      <stop offset=".72" stop-color="#168fe3" stop-opacity=".16"/>
      <stop offset="1" stop-color="#168fe3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tg-plane" x1="5" x2="20.5" y1="5" y2="19.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#effcff"/>
      <stop offset=".36" stop-color="#9ee8ff"/>
      <stop offset=".74" stop-color="#2AABEE"/>
      <stop offset="1" stop-color="#0b7fca"/>
    </linearGradient>
    <linearGradient id="tg-wing" x1="8" x2="16.8" y1="9.2" y2="18.4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#d6f7ff"/>
      <stop offset="1" stop-color="#63d0ff"/>
    </linearGradient>
    <linearGradient id="tg-shine" x1="-4" x2="4" y1="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".48" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset=".68" stop-color="#c8f5ff" stop-opacity=".78"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="tg-blur" x="-55%" y="-55%" width="210%" height="210%">
      <feGaussianBlur stdDeviation="1.75"/>
    </filter>
    <mask id="tg-mask" maskUnits="userSpaceOnUse" x="-3" y="-3" width="30" height="30">
      <rect x="-3" y="-3" width="30" height="30" fill="#000"/>
      <path fill="#fff" d="M3.95 10.75 20.52 4.18c.78-.31 1.55.43 1.28 1.22l-5.2 15.25c-.25.73-1.18.95-1.73.41l-4.26-4.15-2.48 2.42c-.4.39-1.08.22-1.25-.32l-1.43-4.6-3.03-1.45c-.89-.42-.84-1.84.53-2.21Z"/>
    </mask>
  </defs>
  <style>
    .glow{transform-box:fill-box;transform-origin:56% 52%;animation:tgGlow 1.9s ease-in-out infinite}
    .aura{transform-box:fill-box;transform-origin:55% 56%;animation:tgAura 1.9s ease-in-out infinite}
    .plane{transform-box:fill-box;transform-origin:55% 56%;animation:tgFloat 2.2s ease-in-out infinite}
    .shine{animation:tgSweep 2s ease-in-out infinite}
    .spark{transform-box:fill-box;transform-origin:center;animation:tgSpark 2.4s ease-in-out infinite}
    .spark.b{animation-delay:.5s}
    .spark.c{animation-delay:1.05s}
    .spark.d{animation-delay:1.55s}
    @keyframes tgGlow{
      0%,100%{opacity:.5;transform:scale(.95)}
      48%{opacity:1;transform:scale(1.12)}
      72%{opacity:.68;transform:scale(1.03)}
    }
    @keyframes tgAura{
      0%,100%{opacity:.44;transform:scale(1)}
      48%{opacity:.82;transform:scale(1.08)}
      72%{opacity:.56;transform:scale(1.03)}
    }
    @keyframes tgFloat{
      0%,100%{transform:translate(0,0) scale(1)}
      45%{transform:translate(.18px,-.22px) scale(1.025)}
      75%{transform:translate(-.12px,.1px) scale(.995)}
    }
    @keyframes tgSweep{
      0%{opacity:0;transform:translate(-12px,12px) rotate(-28deg)}
      28%{opacity:.95}
      58%{opacity:.12;transform:translate(13px,-13px) rotate(-28deg)}
      100%{opacity:0;transform:translate(13px,-13px) rotate(-28deg)}
    }
    @keyframes tgSpark{
      0%,46%,100%{opacity:0;transform:scale(.5) rotate(0deg)}
      58%{opacity:.95;transform:scale(1.08) rotate(18deg)}
      72%{opacity:.22;transform:scale(.78) rotate(36deg)}
    }
    @media (prefers-reduced-motion: reduce){
      .glow,.aura,.plane,.shine,.spark{animation:none}
      .shine{opacity:.22;transform:translate(2px,-2px) rotate(-28deg)}
      .spark{opacity:.5}
    }
  </style>
  <ellipse class="glow" cx="12.8" cy="12.1" rx="10.6" ry="9.8" fill="url(#tg-glow)" filter="url(#tg-blur)"/>
  <path class="aura" fill="#2AABEE" opacity=".5" filter="url(#tg-blur)" d="M3.95 10.75 20.52 4.18c.78-.31 1.55.43 1.28 1.22l-5.2 15.25c-.25.73-1.18.95-1.73.41l-4.26-4.15-2.48 2.42c-.4.39-1.08.22-1.25-.32l-1.43-4.6-3.03-1.45c-.89-.42-.84-1.84.53-2.21Z"/>
  <g class="plane">
    <path fill="url(#tg-plane)" d="M3.95 10.75 20.52 4.18c.78-.31 1.55.43 1.28 1.22l-5.2 15.25c-.25.73-1.18.95-1.73.41l-4.26-4.15-2.48 2.42c-.4.39-1.08.22-1.25-.32l-1.43-4.6-3.03-1.45c-.89-.42-.84-1.84.53-2.21Z"/>
    <path fill="#ffffff" opacity=".42" d="M4.05 11.64 19.58 5.5 7.15 13.58l-3.1-1.94Z"/>
    <path fill="url(#tg-wing)" d="m7.15 13.58 10.92-7.25-7.46 10.58-2.48 2.42c-.4.39-1.08.22-1.25-.32l.27-5.43Z"/>
    <path fill="#0b7fca" opacity=".45" d="m10.61 16.91 7.46-10.58-5.5 12.48-1.96-1.9Z"/>
    <path fill="#e9fbff" d="m7.15 13.58 9.06-5.98-7.08 7.87-.98 3.38-1-5.27Z"/>
  </g>
  <g mask="url(#tg-mask)">
    <rect class="shine" x="9.4" y="-4" width="3.7" height="32" fill="url(#tg-shine)" opacity="0"/>
  </g>
  <path class="spark" fill="#8fe7ff" d="M20.7 2.05 21.1 3.05l1 .4-1 .4-.4 1-.4-1-1-.4 1-.4.4-1Z"/>
  <path class="spark b" fill="#ffffff" d="M3.2 5.2 3.52 6l.8.32-.8.32-.32.8-.32-.8-.8-.32.8-.32.32-.8Z"/>
  <path class="spark c" fill="#6dd8ff" d="M21.05 17.2 21.42 18.12l.93.38-.93.37-.37.93-.38-.93-.92-.37.92-.38.38-.92Z"/>
  <circle class="spark d" cx="4.3" cy="19.4" r=".7" fill="#bff0ff"/>
</svg>
