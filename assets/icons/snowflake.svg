<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="-3 -3 30 30" role="img" aria-label="Snowflake">
  <defs>
    <linearGradient id="ice-stroke" x1="4" x2="20" y1="2" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".38" stop-color="#9ff3ff"/>
      <stop offset=".72" stop-color="#4fd4ff"/>
      <stop offset="1" stop-color="#1d9fe8"/>
    </linearGradient>
    <linearGradient id="shine" x1="-5" x2="5" y1="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".42" stop-color="#ffffff" stop-opacity=".92"/>
      <stop offset=".62" stop-color="#c9fbff" stop-opacity=".86"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ice-glow-fill" cx="50%" cy="50%" r="62%">
      <stop offset="0" stop-color="#dffbff" stop-opacity=".86"/>
      <stop offset=".48" stop-color="#62d9ff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#1d9fe8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ice-core" cx="42%" cy="36%" r="68%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".48" stop-color="#d7fbff"/>
      <stop offset="1" stop-color="#62d9ff"/>
    </radialGradient>
    <filter id="ice-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.35"/>
    </filter>
    <mask id="flake-mask" maskUnits="userSpaceOnUse" x="-3" y="-3" width="30" height="30">
      <rect x="-3" y="-3" width="30" height="30" fill="#000"/>
      <path fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" d="M12 2.7v18.6M8.72 4.62 12 6.9l3.28-2.28M8.72 19.38 12 17.1l3.28 2.28M3.95 7.35l16.1 9.3M3.88 11.06l3.62-1.58.36-3.95M16.14 18.47l.36-3.95 3.62-1.58M20.05 7.35l-16.1 9.3M16.14 5.53l.36 3.95 3.62 1.58M3.88 12.94l3.62 1.58.36 3.95"/>
      <circle cx="12" cy="12" r="3" fill="#fff"/>
    </mask>
  </defs>
  <style>
    .halo{transform-box:fill-box;transform-origin:50% 50%;animation:iceGlow 3s ease-in-out infinite}
    .flake{animation:iceBreath 3s ease-in-out infinite}
    .sweep{animation:sweep 2.8s ease-in-out infinite}
    .spark{transform-box:fill-box;transform-origin:center;animation:sparkle 2.6s ease-in-out infinite}
    .spark.b{animation-delay:.45s}
    .spark.c{animation-delay:.95s}
    .spark.d{animation-delay:1.45s}
    .spark.e{animation-delay:1.9s}
    @keyframes iceGlow{
      0%,100%{opacity:.42;transform:scale(.96)}
      48%{opacity:.72;transform:scale(1.08)}
      74%{opacity:.5;transform:scale(1)}
    }
    @keyframes iceBreath{
      0%,100%{opacity:.92}
      45%{opacity:1}
      72%{opacity:.88}
    }
    @keyframes sweep{
      0%{opacity:0;transform:translate(-12px,12px) rotate(-28deg)}
      26%{opacity:.95}
      54%{opacity:.15;transform:translate(13px,-13px) rotate(-28deg)}
      100%{opacity:0;transform:translate(13px,-13px) rotate(-28deg)}
    }
    @keyframes sparkle{
      0%,42%,100%{opacity:.12;transform:scale(.55) rotate(0deg)}
      54%{opacity:1;transform:scale(1.16) rotate(18deg)}
      68%{opacity:.34;transform:scale(.78) rotate(36deg)}
    }
    @media (prefers-reduced-motion: reduce){
      .halo,.flake,.sweep,.spark{animation:none}
      .sweep{opacity:.22;transform:translate(2px,-2px) rotate(-28deg)}
      .spark{opacity:.62}
    }
  </style>
  <circle class="halo" cx="12" cy="12" r="10.2" fill="url(#ice-glow-fill)" filter="url(#ice-blur)"/>
  <g class="flake" fill="none" stroke="url(#ice-stroke)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.7v18.6"/>
    <path d="M8.72 4.62 12 6.9l3.28-2.28"/>
    <path d="M8.72 19.38 12 17.1l3.28 2.28"/>
    <path d="M3.95 7.35l16.1 9.3"/>
    <path d="m3.88 11.06 3.62-1.58.36-3.95"/>
    <path d="m16.14 18.47.36-3.95 3.62-1.58"/>
    <path d="m20.05 7.35-16.1 9.3"/>
    <path d="m16.14 5.53.36 3.95 3.62 1.58"/>
    <path d="m3.88 12.94 3.62 1.58.36 3.95"/>
  </g>
  <g mask="url(#flake-mask)">
    <rect class="sweep" x="8.8" y="-4" width="3.4" height="32" fill="url(#shine)" opacity="0"/>
  </g>
  <circle cx="12" cy="12" r="2.35" fill="url(#ice-core)"/>
  <path class="spark" fill="#ffffff" d="M20.1 2.45 20.6 3.7l1.25.5-1.25.5-.5 1.25-.5-1.25-1.25-.5 1.25-.5.5-1.25Z"/>
  <path class="spark b" fill="#dffbff" d="M3.75 3.5 4.15 4.5l1 .4-1 .4-.4 1-.4-1-1-.4 1-.4.4-1Z"/>
  <path class="spark c" fill="#ffffff" d="M21.05 18.55 21.48 19.62l1.07.43-1.07.43-.43 1.07-.43-1.07-1.07-.43 1.07-.43.43-1.07Z"/>
  <path class="spark d" fill="#c9fbff" d="M2.3 17.45 2.62 18.25l.8.32-.8.32-.32.8-.32-.8-.8-.32.8-.32.32-.8Z"/>
  <circle class="spark e" cx="12" cy=".8" r=".82" fill="#ffffff"/>
</svg>
