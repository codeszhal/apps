<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="-3 -3 30 30" role="img" aria-label="Fire">
  <defs>
    <radialGradient id="fire-glow" cx="50%" cy="64%" r="60%">
      <stop offset="0" stop-color="#ffe27a" stop-opacity=".95"/>
      <stop offset=".38" stop-color="#ff8a16" stop-opacity=".55"/>
      <stop offset=".72" stop-color="#ef3b1d" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ef3b1d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fire-outer" x1="6" x2="18.8" y1="2.1" y2="21.8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd34d"/>
      <stop offset=".35" stop-color="#ff8617"/>
      <stop offset=".72" stop-color="#f0441f"/>
      <stop offset="1" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="fire-mid" x1="8.4" x2="15.8" y1="7" y2="21.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe45c"/>
      <stop offset=".48" stop-color="#ff9f1c"/>
      <stop offset="1" stop-color="#f05a1a"/>
    </linearGradient>
    <linearGradient id="fire-inner" x1="10" x2="14.6" y1="10.5" y2="21.3" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".36" stop-color="#fff2a8"/>
      <stop offset=".74" stop-color="#ffc247"/>
      <stop offset="1" stop-color="#ff8a18"/>
    </linearGradient>
    <filter id="fire-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.7"/>
    </filter>
  </defs>
  <style>
    .glow{transform-box:fill-box;transform-origin:50% 58%;animation:fireGlow 1.45s ease-in-out infinite}
    .outer{transform-box:fill-box;transform-origin:50% 86%;animation:fireLean 1.55s ease-in-out infinite}
    .mid{transform-box:fill-box;transform-origin:50% 88%;animation:fireMid 1.35s ease-in-out infinite}
    .inner{transform-box:fill-box;transform-origin:50% 91%;animation:fireInner 1.18s ease-in-out infinite}
    @keyframes fireGlow{
      0%,100%{opacity:.58;transform:scale(.94)}
      42%{opacity:.96;transform:scale(1.1)}
      70%{opacity:.68;transform:scale(1.02)}
    }
    @keyframes fireLean{
      0%,100%{transform:translateX(0) scale(1)}
      28%{transform:translateX(-.32px) scale(.985,1.035)}
      58%{transform:translateX(.28px) scale(1.025,.985)}
      82%{transform:translateX(-.12px) scale(.995,1.02)}
    }
    @keyframes fireMid{
      0%,100%{opacity:.9;transform:translateX(0) scale(1)}
      34%{opacity:1;transform:translateX(.24px) scale(.95,1.09)}
      66%{opacity:.82;transform:translateX(-.2px) scale(1.06,.96)}
    }
    @keyframes fireInner{
      0%,100%{opacity:.96;transform:translateY(0) scale(1)}
      30%{opacity:.72;transform:translateY(.2px) scale(.88,1.16)}
      62%{opacity:1;transform:translateY(-.15px) scale(1.08,.94)}
    }
    @media (prefers-reduced-motion: reduce){
      .glow,.outer,.mid,.inner{animation:none}
    }
  </style>
  <ellipse class="glow" cx="12" cy="14.8" rx="10.1" ry="9.5" fill="url(#fire-glow)" filter="url(#fire-blur)"/>
  <g class="outer">
    <path fill="url(#fire-outer)" d="M12.08 21.8c-4.3 0-7.58-3.06-7.58-7.2 0-2.63 1.24-4.82 3.12-6.5 1.63-1.45 3.03-3.15 2.93-6.24-.01-.43.51-.66.82-.36 1.94 1.83 3.78 4.86 2.42 8.09 1.37-.28 2.35-1.48 3.48-3.42.2-.34.67-.37.91-.06 1.08 1.38 2.03 3.63 2.03 5.99 0 5.74-3.62 9.7-8.13 9.7Z"/>
    <path fill="#fff1a6" opacity=".28" d="M10.63 4.24c.34 2.6-.96 4.4-2.45 5.93-1.16 1.19-1.78 2.66-1.78 4.32 0 2.65 1.6 4.65 4.12 5.34-1.25-1.04-2.01-2.48-2.01-4.05 0-1.88.79-3.22 1.81-4.42 1.1-1.3 1.72-2.84 1.26-4.88a6.4 6.4 0 0 0-.95-2.24Z"/>
  </g>
  <path class="mid" fill="url(#fire-mid)" d="M12.12 21.46c-2.96 0-5.23-2.08-5.23-5 0-1.79.83-3.32 2.2-4.58 1.13-1.04 2.05-2.23 1.98-4.37-.01-.34.41-.52.65-.28 1.32 1.32 2.54 3.31 1.65 5.62 1.02-.24 1.73-1.07 2.46-2.31.17-.29.58-.32.78-.05.73.96 1.33 2.46 1.33 4 0 4.17-2.62 6.97-5.82 6.97Z"/>
  <path class="inner" fill="url(#fire-inner)" d="M12.18 21.12c-1.78 0-3.12-1.25-3.12-3.02 0-1.15.56-2.16 1.45-3 .7-.66 1.27-1.42 1.25-2.77 0-.31.38-.47.59-.24.83.9 1.44 2.11.86 3.56.67-.17 1.13-.73 1.57-1.52.16-.29.56-.31.77-.05.5.64.88 1.63.88 2.57 0 2.67-1.82 4.47-4.25 4.47Z"/>
</svg>
